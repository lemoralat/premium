<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda online con los mejores productos. Envíos a todo el país." data-desde-config>
    <meta name="keywords" content="tienda, productos, ecommerce, compras online">
    <title>Mi Tienda Online - Productos de Calidad</title>
    <link rel="stylesheet" href="css/styles.css">

    <!-- Favicon -->
    <link rel="icon" href="img/lemora.svg" type="image/svg+xml">


    <!-- Canonical URL -->
    <link rel="canonical" href="https://TU-DOMINIO.com/faq">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://TU-DOMINIO.com/faq">
    <meta property="og:title" content="Preguntas Frecuentes - Mi Tienda Online">
    <meta property="og:description" content="Encontrá respuestas a tus dudas sobre envíos, pagos y productos.">
    <meta property="og:image" content="https://TU-DOMINIO.com/img/lemora.svg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://TU-DOMINIO.com/faq">
    <meta name="twitter:title" content="Preguntas Frecuentes - Mi Tienda Online">
    <meta name="twitter:description" content="Encontrá respuestas a tus dudas sobre envíos, pagos y productos.">
    <meta name="twitter:image" content="https://TU-DOMINIO.com/img/lemora.svg">

    <!-- CDN Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"/>
</head>
<body data-page="faq">
    <!-- Header se cargará dinámicamente -->

    <main class="faq-page">
        <div class="faq-container">
            <div class="faq-header">
                <h1>Preguntas Frecuentes</h1>
                <p class="faq-intro">
                    Encuentra respuestas rápidas a las preguntas más comunes sobre nuestra tienda. 
                    Si no encuentras lo que buscas, <a href="/contacto">contáctanos</a>.
                </p>
            </div>

            <div class="faq-sections">
                <!-- El contenido lo carga js/preguntas-frecuentes.js desde la tabla
                     preguntas_frecuentes (panel → Configuración → Preguntas frecuentes).

                     Este contenedor llega VACÍO a propósito: antes traía 270 líneas de
                     FAQ escritas para la tienda original (Mercado Pago, transferencias
                     bancarias, pasos del pedido). En una plantilla que se reparte entre
                     clientes, un cliente nuevo heredaba respuestas sobre medios de pago
                     que puede no tener. Se administran desde el panel, no en el HTML. -->
            </div>
        </div>
    </main>

    <!-- Footer se cargará dinámicamente -->

    <script src="js/template.js" defer type="module"></script>
    <script src="js/busqueda.js" defer type="module"></script>
    <script src="js/menu.js" defer></script>
    <script src="js/salida-popup.js"></script>
    <script src="js/faq.js"></script>
    <script src="js/preguntas-frecuentes.js" defer type="module"></script>
</body>
</html>
