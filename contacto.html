<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contáctanos - Tienda online con los mejores productos. Envíos a todo el país." data-desde-config>
    <meta name="keywords" content="contacto, tienda, productos, ecommerce, compras online">
    <title>Contacto - Mi Tienda Online</title>
    <link rel="stylesheet" href="css/styles.css">

    <!-- Favicon -->
    <link rel="icon" href="img/lemora.svg" type="image/svg+xml">


    <!-- Canonical URL -->
    <link rel="canonical" href="https://supabase.lemora.lat/contacto">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://supabase.lemora.lat/contacto">
    <meta property="og:title" content="Contacto - Mi Tienda Online">
    <meta property="og:description" content="Ponete en contacto con nosotros. Estamos para ayudarte.">
    <meta property="og:image" content="https://supabase.lemora.lat/img/lemora.svg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://supabase.lemora.lat/contacto">
    <meta name="twitter:title" content="Contacto - Mi Tienda Online">
    <meta name="twitter:description" content="Ponete en contacto con nosotros. Estamos para ayudarte.">
    <meta name="twitter:image" content="https://supabase.lemora.lat/img/lemora.svg">

    <!-- CDN Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body data-page="contacto">
    <!-- Header se cargará dinámicamente -->

    <main class="contact-page">
        <div class="contact-grid">

            <!-- Columna Formulario -->
            <div class="contact-container">
                <h1>Contáctanos</h1>
                <p class="contact-intro">
                    ¿Tienes alguna pregunta o consulta? Completa el formulario y te responderemos a través de WhatsApp
                    lo antes posible.
                </p>

                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="contactName">Nombre *</label>
                        <input type="text" id="contactName" name="nombre" placeholder="Tu nombre completo" required>
                    </div>

                    <div class="form-group">
                        <label for="contactMessage">Mensaje *</label>
                        <textarea id="contactMessage" name="mensaje" placeholder="Escribe tu consulta aquí..." required
                            rows="6"></textarea>
                    </div>

<button type="submit" class="submit-contact-btn btn-border">
    <span><i class="fa-brands fa-whatsapp"></i> Enviar mensaje</span>
</button>
                </form>
            </div>

            <!-- Columna Mapa (ubicación desde Configuración → Datos generales;
                 vacía = el bloque no se muestra, sin valores por defecto) -->
            <div class="contact-map-container sin-ubicacion">
                <h2><i class="fa-solid fa-location-dot"></i> Nuestra Ubicación</h2>
                <div class="contact-map">
                    <iframe id="contactMapFrame" src="" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <div class="contact-address" hidden>
                    <p><i class="fa-solid fa-map-pin"></i> <span id="contactAddressText"></span></p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer se cargará dinámicamente -->

    <script src="js/template.js" defer type="module"></script>
    <script src="js/busqueda.js" defer type="module"></script>
    <script src="js/menu.js" defer></script>
    <script src="js/salida-popup.js"></script>
    <script src="js/contacto-form.js" defer type="module"></script>
</body>

</html>
