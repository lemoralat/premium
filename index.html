        crossorigin="anonymous" referrerpolicy="no-referrer" />

<body data-page="inicio">
    <!-- Header se cargará dinámicamente -->

    <main>

        <!--<section class="hero">
            <div class="hero-copy">
                <div class="cont1200 grid">
                <h1>Bienvenido a Nuestra Tienda</h1>
                <p>Descubre productos de calidad al mejor precio</p>
                </div>
            </div>
        </section>-->


        <section class="hero-slider" hidden>
            <div class="slider-track">

                <!-- El hero se alimenta dinámicamente desde Supabase (tabla slider). -->
            </div>

            <button class="slider-nav prev" aria-label="Slide anterior"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
            <button class="slider-nav next" aria-label="Slide siguiente"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>

        </section>


        <!-- Resultados de búsqueda (solo visible cuando hay búsqueda activa) -->
        <section id="productos" class="products-section">

            <div class="products-grid" id="productsGrid">
                <!-- Los resultados de búsqueda se cargarán aquí -->
            </div>

            <div class="no-results" id="noResults">
                <p>No se encontraron productos que coincidan con tu búsqueda</p>
                <a href="#" class="shop-btn btn-border" onclick="limpiarBusqueda()">Ver todos los productos</a>
            </div>
        </section>

        <div id="tienda" class="contenedor"></div>

        <section class="testimonios-carousel" aria-label="Reseñas de clientes">
            <div class="testimonios-viewport">
                <div class="testimonios-track"></div>
            </div>
        </section>

    </main>


    <section class="iconos-pie">

        <div class="iconos cont1200" id="iconosPie"></div>

    </section>

    <!-- <section id="contacto" class="contact-section">

            Enviar WhatsApp
        </a>
    </section> -->

    <script src="js/template.js" defer type="module"></script>
    <script src="js/testimonios.js" defer type="module"></script>
    <script src="js/menu.js" defer></script>
    <script src="js/salida-popup.js" defer></script>
    <script src="js/productos.js" defer type="module"></script>
    <script src="js/carrito.js" defer type="module"></script>
    <script src="js/busqueda.js" defer type="module"></script>
    <script src="js/productos-categorias.js" defer type="module"></script>
    <script src="js/hero-slider.js" type="module"></script>
    <script src="js/iconos-pie.js" type="module"></script>
