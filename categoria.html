<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explorá los productos de esta categoría. Envíos a todo el país.">
    <meta name="keywords" content="tienda, categoría, productos, compras online">
    <title>Categoría - Mi Tienda Online</title>
    <link rel="stylesheet" href="css/styles.css">

    <!-- Favicon -->
    <link rel="icon" href="img/lemora.svg" type="image/svg+xml">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://TU-DOMINIO.com/categoria">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://TU-DOMINIO.com/categoria">
    <meta property="og:title" content="Categoría - Mi Tienda Online">
    <meta property="og:description" content="Explorá los productos de esta categoría. Envíos a todo el país.">
    <meta property="og:image" content="https://TU-DOMINIO.com/img/OpenGraph.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://TU-DOMINIO.com/categoria">
    <meta name="twitter:title" content="Categoría - Mi Tienda Online">
    <meta name="twitter:description" content="Explorá los productos de esta categoría. Envíos a todo el país.">
    <meta name="twitter:image" content="https://TU-DOMINIO.com/img/OpenGraph.png">

    <!-- CDN Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">
</head>
<body data-page="productos">

    <!-- Banner de la categoría: ocupa todo el ancho, con el nombre centrado.
         100% de ancho a propósito (fuera del .contenedor) para que la imagen
         de fondo sangre de borde a borde. -->
    <main>
        <section class="category-banner" id="categoryBanner" aria-labelledby="categoryBannerTitle">
            <span class="category-banner-overlay" aria-hidden="true"></span>
            <h1 class="category-banner-title" id="categoryBannerTitle"></h1>
        </section>

        <div class="category-page contenedor">
            <nav class="breadcrumb" aria-label="Ruta de navegación">
                <a href="/">Inicio</a>
                <span>/</span>
                <a href="/#tienda" id="breadcrumbCatalogo">Productos</a>
                <span>/</span>
                <span id="breadcrumbCategoria"></span>
            </nav>

            <!-- Barra de ordenamiento: se muestra solo cuando hay productos. -->
            <div class="category-toolbar" id="categoryToolbar" hidden>
                <label for="categorySort">Ordenar por</label>
                <select id="categorySort" class="category-sort">
                    <option value="recientes">Más recientes</option>
                    <option value="precio-asc">Precio: menor a mayor</option>
                    <option value="precio-desc">Precio: mayor a menor</option>
                    <option value="nombre-az">Nombre: A-Z</option>
                    <option value="nombre-za">Nombre: Z-A</option>
                </select>
            </div>

            <div class="products-grid" id="categoryProducts"></div>

            <p class="category-empty" id="categoryEmpty" hidden></p>
        </div>
    </main>

    <!-- Footer se cargará dinámicamente -->

    <script src="js/template.js" defer type="module"></script>
    <script src="js/busqueda.js" defer type="module"></script>
    <script src="js/menu.js" defer></script>
    <script src="js/salida-popup.js" defer></script>
    <script src="js/categoria.js" defer type="module"></script>
</body>
</html>
