<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel de administración</title>
    <link rel="icon" href="../img/lemora.svg" type="image/svg+xml">
    <!-- Tabler Icons: subconjunto propio de la fuente (assets/tabler),
         generado por scripts/build-tabler-icons.mjs. Para agregar un ícono:
         usá la clase en el código y corré `npm run build:iconos`. -->
    <link rel="preload" href="../assets/tabler/tabler-icons.woff2" as="font"
        type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../assets/tabler/tabler-icons.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
    <!-- Boot del tema del panel: restaura la CACHÉ local (último tema conocido)
         antes del primer paint. admin-app.js luego lee settings.admin_tema de la
         BD (fuente de verdad global) y reaplica con window.TemaPanel.aplicar().
         Default siempre claro; no detecta la preferencia del dispositivo. -->
    <script src="/admin/js/tema-admin.js"></script>
    <!-- Chart.js (gráficos del Dashboard). SRI fijo: si el hash cambia, el
         navegador bloquea el script y el panel sigue funcionando sin gráficos
         (dashboard.js usa window.Chart con guard). -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
        integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD"
        crossorigin="anonymous"
        defer
    ></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-brand">
                <img src="../img/lemora.svg" alt="Logo de la tienda">
                <span id="adminBrandName">Lemora<br>Administración</span>
            </div>

            <nav class="admin-nav" id="adminNav" aria-label="Secciones del panel">
                <a href="#/dashboard" data-seccion="dashboard"><i class="ti ti-gauge"></i> Dashboard</a>
                <a href="#/diseno" data-seccion="diseno"><i class="ti ti-palette"></i> Diseño</a>
                <a href="#/productos" data-seccion="productos"><i class="ti ti-box"></i> Productos</a>
                <a href="#/categorias" data-seccion="categorias"><i class="ti ti-tags"></i> Categorías</a>
                <a href="#/pedidos" data-seccion="pedidos"><i class="ti ti-shopping-cart"></i> Pedidos</a>
                <a href="#/cupones" data-seccion="cupones"><i class="ti ti-ticket"></i> Descuentos</a>
                <a href="#/slider" data-seccion="slider"><i class="ti ti-photo-plus"></i> Slider</a>
                <a href="#/banners" data-seccion="banners"><i class="ti ti-flag"></i> Banners</a>
                <a href="#/resenas" data-seccion="resenas"><i class="ti ti-star"></i> Reseñas</a>
                <a href="#/iconos-pie" data-seccion="iconos-pie"><i class="ti ti-icons"></i> Iconos</a>
                <a href="#/configuracion" data-seccion="configuracion"><i class="ti ti-settings"></i> Configuración</a>
                <a href="#/cuenta" data-seccion="cuenta"><i class="ti ti-user"></i> Mi cuenta</a>
            </nav>

            <div class="admin-sidebar-footer">
                <a class="btn btn-outline" href="../index.html" target="_blank" rel="noopener">
                    <i class="ti ti-external-link"></i> Ver tienda
                </a>
                <button type="button" class="btn btn-danger" id="btnLogout">
                    <i class="ti ti-logout"></i> Cerrar sesión
                </button>
            </div>
        </aside>

        <div class="admin-main">
            <header class="admin-topbar">
                <div style="display:flex; align-items:center; gap:0.8rem;">
                    <button type="button" class="btn btn-sm admin-menu-toggle" id="btnMenu"
                            aria-label="Abrir menú">
                        <i class="ti ti-menu-2"></i>
                    </button>
                    <div class="admin-topbar-title" id="adminTopbarTitle">Dashboard</div>
                </div>
                <div class="admin-topbar-user">
                    <span id="adminUserEmail"></span>
                    <button type="button" class="admin-tema-switch" id="btnTemaPanel"
                            aria-label="Cambiar tema del panel" title="Tema del panel">
                        <i class="ti ti-sun"></i>
                    </button>
                    <span class="admin-role-badge">Admin</span>
                </div>
            </header>

            <main class="admin-content" id="adminView">
                <p class="admin-loading"><i class="ti ti-loader-2 ti-spin"></i> Cargando…</p>
            </main>
        </div>
    </div>

    <div id="adminToast" aria-live="polite"></div>

    <script src="/admin/js/admin-app.js" type="module"></script>
</body>
</html>
