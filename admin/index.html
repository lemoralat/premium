<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel de administración</title>
    <link rel="icon" href="../img/lemora.svg" type="image/svg+xml">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="/admin/css/admin.css">
    <!-- Boot del tema del panel: restaura la CACHÉ local (último tema conocido)
         antes del primer paint. admin-app.js luego lee settings.admin_tema de la
         BD (fuente de verdad global) y reaplica con window.TemaPanel.aplicar().
         Default siempre claro; no detecta la preferencia del dispositivo. -->
    <script src="/admin/js/tema-admin.js"></script>
    <!-- Chart.js (gráficos del Dashboard). SRI fijo: si el hash cambia, el
         navegador bloquea el script y el panel sigue funcionando sin gráficos
         (dashboard.js usa window.Chart con guard). -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
        integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD"
        crossorigin="anonymous"
        defer
    ></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-brand">
                <img src="../img/lemora.svg" alt="Logo de la tienda">
                <span id="adminBrandName">Lemora<br>Administración</span>
            </div>

            <nav class="admin-nav" id="adminNav" aria-label="Secciones del panel">
                <p class="admin-nav-grupo">General</p>
                <a href="#/dashboard" data-seccion="dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>

                <p class="admin-nav-grupo">Mi negocio</p>
                <a href="#/productos" data-seccion="productos"><i class="fa-solid fa-box"></i> Productos</a>
                <a href="#/categorias" data-seccion="categorias"><i class="fa-solid fa-tags"></i> Categorías</a>
                <a href="#/pedidos" data-seccion="pedidos" data-nav="pedidos-turnos"><i class="fa-solid fa-cart-shopping"></i> Pedidos</a>
                <a href="#/cupones" data-seccion="cupones"><i class="fa-solid fa-ticket"></i> Descuentos</a>
                <a href="#/resenas" data-seccion="resenas"><i class="fa-solid fa-star"></i> Reseñas</a>

                <p class="admin-nav-grupo">Apariencia</p>
                <a href="#/diseno" data-seccion="diseno"><i class="fa-solid fa-palette"></i> Diseño</a>
                <a href="#/carrusel" data-seccion="carrusel"><i class="fa-solid fa-images"></i> Carrusel</a>
                <a href="#/banners" data-seccion="banners"><i class="fa-solid fa-flag"></i> Banners</a>
                <a href="#/iconos-pie" data-seccion="iconos-pie"><i class="fa-solid fa-icons"></i> Iconos</a>

                <p class="admin-nav-grupo">Cuenta</p>
                <a href="#/configuracion" data-seccion="configuracion"><i class="fa-solid fa-gear"></i> Configuración</a>
                <a href="#/cuenta" data-seccion="cuenta"><i class="fa-solid fa-user"></i> Mi cuenta</a>
            </nav>

            </aside>

        <div class="admin-main">
            <header class="admin-topbar">
                <div style="display:flex; align-items:center; gap:0.8rem; min-width:0;">
                    <button type="button" class="btn btn-sm admin-menu-toggle" id="btnMenu"
                            aria-label="Abrir menú">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="admin-topbar-title" id="adminTopbarTitle">Dashboard</div>
                </div>
                <div class="admin-topbar-user">
                    <span id="adminUserEmail"></span>
                    <a class="admin-topbar-icono" href="/" target="_blank" rel="noopener"
                       aria-label="Ver tienda" title="Ver tienda">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                    <button type="button" class="admin-tema-switch" id="btnTemaPanel"
                            aria-label="Cambiar tema del panel" title="Tema del panel">
                        <i class="fa-solid fa-sun"></i>
                    </button>
                    <button type="button" class="admin-topbar-icono admin-topbar-icono-peligro" id="btnLogout"
                            aria-label="Cerrar sesión" title="Cerrar sesión">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                    <span class="admin-role-badge">Admin</span>
                </div>
            </header>

            <main class="admin-content" id="adminView">
                <p class="admin-loading"><i class="fa-solid fa-spinner fa-spin"></i> Cargando…</p>
            </main>
        </div>
    </div>

    <div id="adminToast" aria-live="polite"></div>

    <script src="/admin/js/admin-app.js" type="module"></script>
</body>
</html>
