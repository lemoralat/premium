<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Iniciar sesión — Panel de administración</title>
    <link rel="icon" href="../img/lemora.svg" type="image/svg+xml">
    <!-- Tabler Icons: subconjunto propio de la fuente (assets/tabler),
         generado por scripts/build-tabler-icons.mjs. Para agregar un ícono:
         usá la clase en el código y corré `npm run build:iconos`. -->
    <link rel="preload" href="../assets/tabler/tabler-icons.woff2" as="font"
        type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../assets/tabler/tabler-icons.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <img src="../img/lemora.svg" alt="Logo de la tienda">
        </div>
        <h1>Panel de administración</h1>
        <p class="login-sub">Iniciá sesión para gestionar tu tienda</p>

        <form id="loginForm" class="admin-form" novalidate>
            <div class="admin-field">
                <label for="loginEmail">Correo electrónico</label>
                <input type="email" id="loginEmail" name="email" autocomplete="username" required
                       placeholder="vos@tudominio.com">
            </div>
            <div class="admin-field">
                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" name="password" autocomplete="current-password"
                       required minlength="6" placeholder="••••••••">
            </div>
            <div id="loginError" class="admin-error-text" hidden></div>
            <button type="submit" class="btn btn-primary btn-lg">Iniciar sesión</button>
        </form>

        <div class="login-extra">
            <a href="#" id="btnRecuperar">¿Olvidaste tu contraseña?</a>
            <a href="../index.html">Ver tienda</a>
        </div>
    </div>

    <script src="/admin/js/login.js" type="module"></script>
</body>
</html>
