<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Iniciar sesión — Panel de administración</title>
    <link rel="icon" href="../img/lemora.svg" type="image/svg+xml">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <img src="../img/lemora.svg" alt="Logo de la tienda">
        </div>
        <h1>Panel de administración</h1>
        <p class="login-sub">Iniciá sesión para gestionar tu tienda</p>

        <form id="loginForm" class="admin-form" novalidate>
            <div class="admin-field">
                <label for="loginEmail">Correo electrónico</label>
                <input type="email" id="loginEmail" name="email" autocomplete="username" required
                       placeholder="vos@tudominio.com">
            </div>
            <div class="admin-field">
                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" name="password" autocomplete="current-password"
                       required minlength="6" placeholder="••••••••">
            </div>
            <div id="loginError" class="admin-error-text" hidden></div>
            <button type="submit" class="btn btn-primary btn-lg">Iniciar sesión</button>
        </form>

        <div class="login-extra">
            <a href="#" id="btnRecuperar">¿Olvidaste tu contraseña?</a>
            <a href="../index.html">Ver tienda</a>
        </div>
    </div>

    <script src="js/login.js" type="module"></script>
</body>
</html>
