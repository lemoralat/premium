<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Nueva contraseña — Panel de administración</title>
    <link rel="icon" href="../img/lemora.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <img src="../img/lemora.svg" alt="Logo de la tienda">
        </div>
        <h1>Crear nueva contraseña</h1>
        <p class="login-sub">Elegí una contraseña nueva para tu cuenta de administrador</p>

        <form id="recuperarForm" class="admin-form" novalidate>
            <div class="admin-field">
                <label for="newPassword">Contraseña nueva</label>
                <input type="password" id="newPassword" name="password" autocomplete="new-password"
                       required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="admin-field">
                <label for="confirmPassword">Repetí la contraseña</label>
                <input type="password" id="confirmPassword" name="confirm" autocomplete="new-password"
                       required minlength="6" placeholder="Repetí la contraseña">
            </div>
            <div id="recuperarError" class="admin-error-text" hidden></div>
            <button type="submit" class="btn btn-primary btn-lg">Guardar nueva contraseña</button>
        </form>

        <a class="login-back" href="login.html">Volver a iniciar sesión</a>
    </div>

    <script src="js/recuperar.js" type="module"></script>
</body>
</html>
