<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda online con los mejores productos. Envíos a todo el país." data-desde-config>
    <meta name="keywords" content="tienda, productos, ecommerce, compras online">
    <title>Mi Tienda Online - Productos de Calidad</title>
    <link rel="stylesheet" href="css/styles.css">

    <!-- Favicon -->
    <link rel="icon" href="img/lemora.svg" type="image/svg+xml">


    <!-- Canonical URL -->
    <link rel="canonical" href="https://TU-DOMINIO.com/carrito">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://TU-DOMINIO.com/carrito">
    <meta property="og:title" content="Carrito de Compras - Mi Tienda Online">
    <meta property="og:description" content="Revisá tu pedido y finalizá tu compra. Envíos a todo el país.">
    <meta property="og:image" content="https://TU-DOMINIO.com/img/lemora.svg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://TU-DOMINIO.com/carrito">
    <meta name="twitter:title" content="Carrito de Compras - Mi Tienda Online">
    <meta name="twitter:description" content="Revisá tu pedido y finalizá tu compra. Envíos a todo el país.">
    <meta name="twitter:image" content="https://TU-DOMINIO.com/img/lemora.svg">

    <!-- CDN Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body data-page="carrito">
    <!-- Header se cargará dinámicamente -->

    <main class="cart-page contenedor">

        <!-- El banner del carrito se carga dinámicamente desde Supabase (tabla banners). -->
        <!-- Banner dinámico: el que tiene en_carrito, elegido en el panel; js/carrito.js lo muestra si existe -->
        <section id="banner-carrito" hidden></section>

        <h1 class="titulo">Tu Carrito de Compras</h1>

        <div class="cart-container">

            <div class="cart-items" id="cartItems">
                <!-- Los items se cargarán dinámicamente -->
            </div>

            <div class="cart-summary">
                
                <h2>Cupón de Descuento</h2>
                <div class="coupon-section">
                    <input type="text" id="couponInput" placeholder="Código de cupón">
                    <button onclick="aplicarCupon()" id="applyCouponBtn" class="btn-border">Aplicar</button>
                    <button onclick="eliminarCupon()" id="removeCouponBtn" class="remove-coupon-btn btn-border" style="display: none;">Eliminar Cupón</button>
                </div>

                <h2>Resumen del Pedido</h2>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0,00</span>
                </div>
                <div class="summary-row">
                    <span>Envío:</span>
                    <span id="shipping">A calcular</span>
                </div>
                <div class="summary-row" id="descuentoRow" style="display: none;">
                    <span>Descuento:</span>
                    <span id="descuento" style="color: var(--danger-color); font-weight: 400;">$0,00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">$0,00</span>
                </div>
                <div id="minCompraAviso" class="compra-minima-aviso" hidden></div>
                <button class="checkout-btn btn-border" id="checkoutBtn">Finalizar Compra</button>
            </div>
        </div>

        <div id="checkoutForm" class="checkout-form container-sg hidden">
            <h2>Datos de Envío</h2>
            <form id="shippingForm" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono *</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección *</label>
                    <input type="text" id="direccion" name="direccion" required>
                </div>

                <div class="form-group">
                    <label for="ciudad">Ciudad *</label>
                    <input type="text" id="ciudad" name="ciudad" required>
                </div>

                <div class="form-group">
                    <label for="provincia">Provincia *</label>
                    <input type="text" id="provincia" name="provincia" required>
                </div>

                <div class="form-group">
                    <label for="codigoPostal">Código Postal * <span class="cp-hint">¿No sabés tu código postal? <a href="https://www.correoargentino.com.ar/formularios/cpa" target="_blank" rel="noopener">Consultalo acá</a></span></label>
                    <input type="text" id="codigoPostal" name="codigoPostal" required>
                </div>

                <div class="form-group">
                    <label for="notas">Notas adicionales</label>
                    <textarea id="notas" name="notas" rows="3"></textarea>
                </div>

                <!-- Honeypot anti-bots: posicionado fuera de pantalla, invisible
                     para humanos y fuera del orden de tabulación. Si un bot lo
                     completa, el pedido se descarta (cliente y servidor). -->
                <div class="form-group" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden" aria-hidden="true">
                    <label for="website">Sitio web</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
                </div>

<button type="submit" class="submit-btn btn-border">
    <span>Enviar Pedido ahora</span>
</button>

                <p class="seguro">
                    <i class="fa-solid fa-lock"></i> Tus datos están seguros y solo se usan para procesar tu pedido.
                </p>
            </form>
        </div>
    </main>

    <!-- Footer se cargará dinámicamente -->

    <script src="js/template.js" defer type="module"></script>
    <script src="js/busqueda.js" defer type="module"></script>
    <script src="js/menu.js" defer></script>
    <script src="js/salida-popup.js"></script>
    <script type="module" src="js/carrito.js"></script>
    <script type="module" src="js/formulario.js"></script>
</body>

</html>
